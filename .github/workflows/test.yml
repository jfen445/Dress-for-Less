name: Tests

on:
  push:
  pull_request:

jobs:
  vitest:
    name: Unit, route and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # No secrets: the suite mocks the DAO layer, Stripe, Sanity and NZ Post.
      - run: npm test

  playwright:
    name: Browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Also no secrets: every /api/** call is intercepted in the browser, and
      # the dev server's own Sanity calls are answered by the Node-level preload
      # in tests/e2e/sanity-intercept.cjs.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
